# Self-hosted one-command deployment (Cardano PREPROD only).
#
#   cp .env.example .env        # put your Blockfrost preprod project id in it
#   docker compose up --build -d
#
# → frontend http://localhost:3000, backend http://localhost:3001.
# Everything runs on YOUR machine; nobody operates this as a service for you.
# PostgreSQL stays on the internal network (not published to the host) and is
# only a cache — the chain is the source of truth, so the volume is safe to
# wipe (docker compose down -v) at any time.
#
# For development (hot reload, host npm) use ./ship.sh or docs/development.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p2pdex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p2pdex-local}
      POSTGRES_DB: ${POSTGRES_DB:-p2pdex}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is applied on FIRST boot of the volume only; after schema
      # changes: docker compose down -v && docker compose up (cache only).
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p2pdex} -d ${POSTGRES_DB:-p2pdex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      CARDANO_NETWORK: preprod
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-p2pdex}:${POSTGRES_PASSWORD:-p2pdex-local}@postgres:5432/${POSTGRES_DB:-p2pdex}
      # Chain provider — "blockfrost" (needs a free preprod project id from
      # https://blockfrost.io) or "koios" (keyless by default). Either can
      # also be set/changed later from the app's Settings page with no
      # restart needed — these env vars are just the first-boot default.
      CHAIN_PROVIDER: ${CHAIN_PROVIDER:-blockfrost}
      BLOCKFROST_PROJECT_ID_PREPROD: ${BLOCKFROST_PROJECT_ID_PREPROD:-}
      KOIOS_API_TOKEN: ${KOIOS_API_TOKEN:-}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-3}
      # Optional cross-checks / tuning — see backend/.env.example for docs.
      ORDER_VALIDATOR_HASH: ${ORDER_VALIDATOR_HASH:-}
      BEACON_POLICY_ID: ${BEACON_POLICY_ID:-}
      REFERENCE_SCRIPT_TX_ID: ${REFERENCE_SCRIPT_TX_ID:-}
      REFERENCE_SCRIPT_INDEX: ${REFERENCE_SCRIPT_INDEX:-0}
    volumes:
      - backend-data:/app/backend/data
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Leave empty (default): the browser talks same-origin to the
        # frontend, which proxies /backend/* to the backend container —
        # works under any hostname/IP. Only set this to make the browser
        # call a backend at a DIFFERENT address (baked in at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      # Where the same-origin proxy forwards API calls (server-side, runtime).
      BACKEND_INTERNAL_URL: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend-data:
