# Builds and publishes production Docker images to GHCR when a version tag
# is pushed (git tag v0.1.0 && git push --tags). Images:
#   ghcr.io/<owner>/<repo>-backend:<version|latest>
#   ghcr.io/<owner>/<repo>-frontend:<version|latest>
#
# The frontend serves a same-origin /backend/* proxy (target set at runtime
# via BACKEND_INTERNAL_URL), so the prebuilt image works under any
# hostname/IP — no per-host rebuild needed.
name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
