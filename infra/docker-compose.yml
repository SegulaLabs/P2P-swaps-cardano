# DEV infrastructure: PostgreSQL only. For running the whole app in Docker
# use the root docker-compose.yml instead (production images, one command).
# No mainnet services exist here and none may be added for the MVP.
#
# Usage (from repo root):
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
#   npm run dev            # backend + frontend on the host, against this DB

services:
  postgres:
    image: postgres:16-alpine
    container_name: p2pdex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p2pdex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-p2pdex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema applied on FIRST container boot only; to reapply after schema
      # changes: docker compose down -v && up (dev-only cache, safe to wipe).
      - ../backend/src/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p2pdex} -d ${POSTGRES_DB:-p2pdex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # kupo:    (future — self-hosted indexer matching on the beacon policy id)
  # ogmios:  (future — websocket bridge to a cardano-node)
  # cardano-node: (future — self-hosted preprod node; NEVER mainnet in MVP)

volumes:
  pgdata:
